# API (with its MCP servers) + web UI on http://localhost:8080. Workflows, runs and the workspace persist in `flows`.
#   cp .env.example .env   # add ANTHROPIC_API_KEY, or set FLOWMIND_LLM=scripted to run offline
#   docker compose up --build
services:
  api:
    build: ./backend
    env_file: .env
    environment:
      FLOWMIND_CORS_ORIGINS: '["http://localhost:8080"]'
    volumes: [flows:/app/data]

  web:
    build: ./frontend
    ports: ["8080:80"]
    depends_on:
      api: { condition: service_healthy }

volumes:
  flows:
